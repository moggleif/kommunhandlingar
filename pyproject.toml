[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kommunhandlingar"
version = "0.12.0"
requires-python = ">=3.12"
# Konverteringen (ADR-0005, ADR-0014). pdfminer.six och Pillow används också
# direkt och låses därför här, på de versioner pdfplumber drar in.
dependencies = [
  "pdfplumber==0.11.10",
  "pdfminer.six==20260107",
  "pypdfium2==5.15.2",
  "pillow==13.0.0",
  # Webbplatsen renderar dokumenten (ADR-0023); testerna prövar texten (ADR-0021).
  "markdown-it-py==4.2.0",
]

[project.optional-dependencies]
# Samma versioner i CI och lokalt; Dependabot håller dem uppdaterade.
utveckling = ["ruff==0.17.4", "pip-audit==2.10.1"]

# Webbplatsens skript och stilar följer med paketet, så att ett datarepo som
# installerar en fast version kan bygga sidorna (ADR-0080).
[tool.setuptools.package-data]
"kommunhandlingar.webbplats" = ["*.js", "*.css"]

[tool.ruff.lint]
# Vanliga felkontroller plus gränserna i "Ren kod – strikt" i AGENTS.md.
# Rader per funktion och fil kontrolleras av scripts/kontrollera_storlek.py.
preview = true
explicit-preview-rules = true
select = [
  "E", "F", "W", "I", "B", "UP", "SIM",
  "C90",      # cyklomatisk komplexitet
  "PLR0913",  # parametrar
  "PLR1702",  # nästlingsnivåer (preview)
  "ERA",      # bortkommenterad kod
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4
max-nested-blocks = 3
