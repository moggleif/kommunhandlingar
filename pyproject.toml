[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kommunhandlingar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.ruff.lint]
# Vanliga felkontroller plus gränserna i "Ren kod – strikt" i AGENTS.md.
# Rader per funktion och fil kontrolleras av scripts/kontrollera_storlek.py.
preview = true
explicit-preview-rules = true
select = [
  "E", "F", "W", "I", "B", "UP", "SIM",
  "C90",      # cyklomatisk komplexitet
  "PLR0913",  # parametrar
  "PLR1702",  # nästlingsnivåer (preview)
  "ERA",      # bortkommenterad kod
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4
max-nested-blocks = 3
