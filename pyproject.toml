[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kommunhandlingar"
version = "0.4.0"
requires-python = ">=3.12"
# Konverteringen (ADR-0005, ADR-0014). pdfminer.six och Pillow används också
# direkt och låses därför här, på de versioner pdfplumber drar in.
dependencies = [
  "pdfplumber==0.11.10",
  "pdfminer.six==20260107",
  "pypdfium2==5.14.0",
  "pillow==12.3.0",
]

[project.optional-dependencies]
# Samma versioner i CI och lokalt; Dependabot håller dem uppdaterade.
utveckling = ["ruff==0.16.10", "pip-audit==2.10.1", "markdown-it-py==4.2.0"]

[tool.ruff.lint]
# Vanliga felkontroller plus gränserna i "Ren kod – strikt" i AGENTS.md.
# Rader per funktion och fil kontrolleras av scripts/kontrollera_storlek.py.
preview = true
explicit-preview-rules = true
select = [
  "E", "F", "W", "I", "B", "UP", "SIM",
  "C90",      # cyklomatisk komplexitet
  "PLR0913",  # parametrar
  "PLR1702",  # nästlingsnivåer (preview)
  "ERA",      # bortkommenterad kod
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4
max-nested-blocks = 3
