# Kungsbacka kommun. Schemat står i docs/03-ARKITEKTUR.md#kommunkonfigurationen,
# och hur kommunen publicerar i docs/kallor/kungsbacka.md.
#
# Organen står i den ordning de hämtas (K13, ADR-0010). Ett utskott har
# `hor_till`, så att det får sin nämnds färgton i kalendern (K22).

namn = "Kungsbacka kommun"

# Med omkonvertera = true hämtas dokument från en annan version av poolen igen
# och konverteras om, efter allt nytt (ADR-0019); avstängt tills
# konverteringen är färdig.
omkonvertera = false

