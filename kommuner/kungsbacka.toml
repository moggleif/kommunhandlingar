# Mötessidorna på kungsbacka.se (ADR-0011): organet är sidans, typen står i
# filnamnet, och datumet i filnamnet eller i mötets rubrik. Organen i wayback
# läses också ur Internet Archive (ADR-0018, ADR-0027); övriga väntar tills
# konverteringen är färdig.
[[kalla]]
adapter = "sitevision"
wayback = ["ga"]
manader = [
  "januari", "februari", "mars", "april", "maj", "juni",
  "juli", "augusti", "september", "oktober", "november", "december",
]
rubrik = '^(?P<dag>\d{1,2}) (?P<manad>[a-zåäö]+) (?P<ar>\d{4})'

# Typ och datum, i den ordning de oftast står: "Kommunfullmäktige protokoll 2026-08-11".
[[kalla.monster]]
regex = '(?i)(?P<typ>kallelse|handlingar|protokoll).*?(?P<ar>\d{4})-(?P<manad>\d{2})-(?P<dag>\d{2})'

# Typ utan fullständigt datum: "Valnämnden protokoll 24-11-11"; datumet tas ur rubriken.
[[kalla.monster]]
regex = '(?i)(?P<typ>kallelse|handlingar|protokoll)'

# Revisionens sammanträdesanteckningar, protokollsutdrag med bara "§" och
# stavningen "potokoll" är protokoll.
[[kalla.monster]]
typ = "protokoll"
regex = '(?i)(?:potokoll|sammanträdesanteckningar|§).*?(?P<ar>\d{4})-(?P<manad>\d{2})-(?P<dag>\d{2})'

[[kalla.monster]]
typ = "protokoll"
regex = '(?i)potokoll|sammanträdesanteckningar|§'

