# Webbplatsens två Episerver-generationer, 2013–2022, som bara finns i
# Internet Archive (ADR-0039). Organen i mappar läses ur arkivet; övriga
# väntar tills konverteringen är färdig. Gymnasie och Vuxenutbildning
# läggs under ga.
[[kalla]]
adapter = "episerver"
manader = ["jan", "feb", "mar", "apr", "maj", "jun", "jul", "aug", "sep", "okt", "nov", "dec"]
# Mönstren prövas mot sökvägen under mappen: "Protokoll/2013/GV protokoll 20 nov.pdf".
# Ett datum i filnamnet går före mappens år: 2021-mappen har möten från 2022.
datum = [
  '(?P<ar>\d{4})-(?P<manad>\d{2})-(?P<dag>\d{2})',
  '(?<!\d)(?P<ar>\d{4})(?P<manad>\d{2})(?P<dag>\d{2})(?!\d)',
  '(?i)(?<!\d)(?P<dag>\d{1,2})[ _]+(?P<manad>[a-zåäö]{3})[a-zåäö]*[ _]+(?P<ar>\d{4})',
  '(?<!\d)(?P<ar>\d{2})-(?P<manad>\d{2})-(?P<dag>\d{2})(?!\d)',
  '(?<!\d)(?P<ar>\d{2})(?P<manad>\d{2})(?P<dag>\d{2})(?!\d)',
  '(?i)^[^/]+/(?P<ar>\d{4})/[^/]*?(?<!\d)(?P<dag>\d{1,2})[ _]+(?P<manad>[a-zåäö]{3})',
]

[kalla.mappar]
ga = [
  "kungsbacka.se/Global/Kommun och politik/Dokument/Möten, handlingar och protokoll/Gymnasie och Vuxenutbildning/",
  "kungsbacka.se/globalassets/kommun-och-politik/dokument/moten-handlingar-och-protokoll/gymnasium--arbetsmarknad/",
]

# Typen: handlingarnas mapp gäller också för "kallelse-till-web-20180919.pdf",
# som är kallelsen med alla handlingar. Annars filnamnet, och sist mappen;
# Protokoll/2014 har också kallelser och handlingar.
[[kalla.typer]]
typ = "handlingar"
regex = '(?i)^handlingar/'

[[kalla.typer]]
typ = "kallelse"
regex = '(?i)/[^/]*(?:kallelse|dagordning)[^/]*$'

[[kalla.typer]]
typ = "handlingar"
regex = '(?i)/[^/]*(?:handlingar|underlag)[^/]*$'

[[kalla.typer]]
typ = "protokoll"
regex = '(?i)/[^/]*protokoll[^/]*$'

[[kalla.typer]]
typ = "kallelse"
regex = '(?i)^dagordningar/'

[[kalla.typer]]
typ = "protokoll"
regex = '(?i)^protokoll/'

