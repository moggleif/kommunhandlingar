# TILLFÄLLIG (#23): kartlägger diariet, anslagstavlan och e-arkivet.
# Tas bort när utredningen är klar; mergas aldrig.
name: Prov av diariet

on:
  push:
    branches: [claude/project-thread-w7czqc]

permissions:
  contents: read

jobs:
  prov:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Värdarna
        run: |
          UA="kommunhandlingar (+https://github.com/moggleif/kommunhandlingar)"
          for h in ciceronsok.kungsbacka.se ciceronanslagstavla.kungsbacka.se arkiv.kungsbacka.se; do
            for p in /robots.txt /; do
              echo "########## https://$h$p"
              curl -sS -L -A "$UA" --max-time 30 -D - "https://$h$p" | head -c 12000 || true
              echo
              sleep 5
            done
          done
