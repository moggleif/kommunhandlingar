# TILLFÄLLIG (#51): prövar arkivets upptäckt och tre hämtningar mot
# web.archive.org. Tas bort före merge.
name: Prov av arkivet

on:
  push:
    branches: [claude/project-thread-iq03lg]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prov:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-swe
      - run: pip install -e .
      - name: robots.txt hos web.archive.org
        run: curl -sS -A "kommunhandlingar (+https://github.com/moggleif/kommunhandlingar)" https://web.archive.org/robots.txt | head -40
      - name: Arkivets upptäckt
        run: |
          python -m kommunhandlingar.upptack kommuner/kungsbacka.toml "$RUNNER_TEMP/arbete" \
            --arkiv --start "$(date +%s)" | tee "$RUNNER_TEMP/upptackt.txt"
      - name: Listan i siffror
        run: |
          python - "$RUNNER_TEMP/arbete/kungsbacka.arkiv.kandidater.json" <<'PY'
          import json, sys
          from collections import Counter
          lista = json.load(open(sys.argv[1]))
          print(len(lista), "kandidater")
          print(Counter((k["organ"], k["datum"][:4]) for k in lista).most_common())
          for k in lista[:5]:
              print(k)
          PY
      - name: Tre hämtningar
        run: |
          python - "$RUNNER_TEMP/arbete/kungsbacka.arkiv.kandidater.json" <<'PY'
          import json, sys
          fil = sys.argv[1]
          lista = json.load(open(fil))
          json.dump(lista[:3], open(fil, "w"), ensure_ascii=False)
          PY
          python -m kommunhandlingar.hamta kommuner/kungsbacka.toml "$RUNNER_TEMP/arbete" --arkiv
          git status --short data | head
          for f in $(git status --short data | awk '{print $2}' | head -3); do find "$f" -name '*.md' -exec head -30 {} \; ; done
