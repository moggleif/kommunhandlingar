# TILLFÄLLIG (#88): arkivets upptäckt med Episerver-adaptern, och en fil
# vars datum behöver ett belägg. Tas bort före merge.
name: Prov av Episerver-arkivet

on:
  push:
    branches: [claude/project-thread-wynbq3]

permissions:
  contents: read

jobs:
  prov:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -e .
      - name: Första sidan
        run: |
          curl -sSfL -A "kommunhandlingar (+https://github.com/moggleif/kommunhandlingar)" -o fil.pdf \
            "https://web.archive.org/web/20220319194137id_/https://www.kungsbacka.se/globalassets/kommun-och-politik/dokument/moten-handlingar-och-protokoll/gymnasium--arbetsmarknad/dagordningar/2021/21-04-08-kallelse.pdf"
          pdftotext -l 1 -layout fil.pdf - | grep -v '^\s*$' | head -12
      - name: Arkivets upptäckt
        run: |
          python -m kommunhandlingar.upptack kommuner/kungsbacka.toml "$RUNNER_TEMP/arbete" --arkiv | grep -v "^Ingen kandidat: .*ingen kopia" | tail -40
          python - "$RUNNER_TEMP/arbete/kungsbacka.arkiv.kandidater.json" <<'PY'
          import json, sys
          lista = json.load(open(sys.argv[1]))
          episerver = [k for k in lista if k["kallnyckel"].startswith("episerver:")]
          print(len(lista), "kandidater,", len(episerver), "från Episerver")
          for k in sorted(episerver, key=lambda k: k["datum"]):
              print(k["datum"], k["typ"], k["filnamn"])
          PY
