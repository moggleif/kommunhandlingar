# TILLFÄLLIG (#88): läser första sidorna av de GA-filer i arkivets
# Episerver-generationer vars namn saknar datum. Tas bort före merge.
name: Prov av Episerver-arkivet

on:
  push:
    branches: [claude/project-thread-wynbq3]

permissions:
  contents: read

jobs:
  prov:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Första sidorna
        run: |
          ua="kommunhandlingar (+https://github.com/moggleif/kommunhandlingar)"
          while read -r kopia; do
            echo "=== $kopia"
            for forsok in 1 2 3 4; do
              curl -sSfL -A "$ua" -m 300 -o fil.pdf "https://web.archive.org/web/$kopia" && break
              sleep $((forsok * 15))
            done
            pdfinfo fil.pdf | grep -E "Pages|CreationDate" || true
            pdftotext -l 2 -layout fil.pdf - | grep -v '^\s*$' | head -45 || true
            sleep 5
          done <<'LISTA'
