# Den schemalagda körningen (K11, ADR-0006, ADR-0015 och ADR-0052): upptäckt
# och steg 2 för varje kommun, sedan för arkivet (K16, ADR-0018),
# datakontrollerna, en egen gren med datat och en PR som mergas automatiskt.
name: Nattkörning

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nattkorning
  cancel-in-progress: false

# `shell: bash` ger `-eo pipefail`; utan den kör Actions `bash -e`, och ett
# fel i steg 2 före `| tee` skulle inte stoppa körningen (K11).
defaults:
  run:
    shell: bash

jobs:
  korning:
    name: Hämta och konvertera
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    outputs:
      gren: ${{ steps.incheckning.outputs.gren }}
    steps:
      - name: Jobbets start, som tidsbudgeten räknas från
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tesseract med svensk modell (OCR, ADR-0005)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-swe
      - run: pip install -e .
      - name: Upptäckt och steg 2 för varje kommun
        run: |
          for kommunfil in kommuner/*.toml; do
            python -m kommunhandlingar.upptack "$kommunfil" "$RUNNER_TEMP/arbete"
            python -m kommunhandlingar.hamta "$kommunfil" "$RUNNER_TEMP/arbete" \
              --start "$START" | tee -a "$RUNNER_TEMP/sammanfattning.txt"
          done
      - name: Arkivet för varje kommun, när det levande är hämtat
        # Ett fel i arkivet stoppar inte incheckningen av det levande (ADR-0018).
        continue-on-error: true
        run: |
          for kommunfil in kommuner/*.toml; do
            python -m kommunhandlingar.upptack "$kommunfil" "$RUNNER_TEMP/arbete" \
              --arkiv --start "$START" | tee -a "$RUNNER_TEMP/sammanfattning.txt"
            python -m kommunhandlingar.hamta "$kommunfil" "$RUNNER_TEMP/arbete" \
              --arkiv --start "$START" | tee -a "$RUNNER_TEMP/sammanfattning.txt"
          done
      - name: Datakontrollerna
        run: python -m kommunhandlingar.datakontroll data
      - name: Bara textfiler under data/
        run: |
          git add -A
          if git -c core.quotePath=false diff --cached --name-only | grep -v '^data/'; then exit 1; fi
          if git diff --cached --numstat | grep '^-'; then exit 1; fi
      - name: Checka in på en egen gren
        id: incheckning
        run: |
          if git diff --cached --quiet; then
            echo "Inget nytt i poolen." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gren="nattkorning/$(date -u +%F)-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Nattkörning $(date -u +%F)"
          git push origin "HEAD:refs/heads/$gren"
          echo "gren=$gren" >> "$GITHUB_OUTPUT"
      - name: Sammanfattning
        if: always()
        run: |
          {
            echo '```'
            tail -n 200 "$RUNNER_TEMP/sammanfattning.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  pr:
    # Ett eget jobb på en ny runner, så att inget som hämtats kan nå token
    # (ADR-0052).
    name: PR med automatisk merge
    needs: korning
    if: needs.korning.outputs.gren != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.NATTKORNING_TOKEN }}
          GREN: ${{ needs.korning.outputs.gren }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Datat ligger på grenen \`$GREN\`; öppna en PR därifrån (ADR-0015)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$GREN" \
            --title "Nattkörning ${GREN:12:10}" \
            --body "Datat från nattkörningen; mergas när kontrollen gått igenom (ADR-0052)."
          gh pr merge "$GREN" --repo "$GITHUB_REPOSITORY" --auto --merge
          echo "PR från \`$GREN\` mergas när kontrollen gått igenom (ADR-0052)." >> "$GITHUB_STEP_SUMMARY"
