# Den schemalagda körningen (K11, K53, ADR-0006, ADR-0015, ADR-0052, ADR-0061
# och ADR-0077): först mötessidorna, upptäckt och steg 2 för varje kommun,
# sedan arkivet (K16, ADR-0018) ovanpå deras gren. Varje del kontrolleras,
# checkas in på en egen gren och får en PR som mergas automatiskt.
name: Nattkörning

on:
  schedule:
    - cron: "23 1 * * *"
    # Tills arkivet är ikapp: tas bort när sammanfattningen inte längre har
    # arkivfiler som väntar på nästa körning (ADR-0061).
    - cron: "23 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nattkorning
  cancel-in-progress: false

# `shell: bash` ger `-eo pipefail`; utan den kör Actions `bash -e`, och ett
# fel i steg 2 före `| tee` skulle inte stoppa körningen (K11).
defaults:
  run:
    shell: bash

jobs:
  moten:
    name: Mötessidorna
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    outputs:
      gren: ${{ steps.incheckning.outputs.gren }}
    steps:
      - name: Jobbets start, som tidsbudgeten räknas från
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tesseract med svensk modell (OCR, ADR-0005)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-swe
      - run: pip install -e .
      - name: Mötessidorna, bara det nya och ändrade
        uses: ./.github/actions/levande
        with:
          flaggor: --utan-omkonvertering
      - id: incheckning
        uses: ./.github/actions/checka-in
        with:
          del: moten
      - name: Sammanfattning
        if: always()
        run: |
          {
            echo '```'
            tail -n 200 "$RUNNER_TEMP/sammanfattning.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  pr-moten:
    needs: moten
    if: needs.moten.outputs.gren != ''
    uses: ./.github/workflows/nattkorning-pr.yml
    with:
      gren: ${{ needs.moten.outputs.gren }}
    secrets:
      NATTKORNING_TOKEN: ${{ secrets.NATTKORNING_TOKEN }}

  # Från mötenas gren, så att arkivets PR inte krockar med deras; utan gren,
  # eller om mötessidorna föll, från main (ADR-0077).
  arkiv:
    name: Omkonvertering och arkiv
    needs: moten
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    outputs:
      gren: ${{ steps.incheckning.outputs.gren }}
    steps:
      - name: Jobbets start, som tidsbudgeten räknas från
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.moten.outputs.gren || 'main' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tesseract med svensk modell (OCR, ADR-0005)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-swe
      - run: pip install -e .
      # Upptäckten görs om, eftersom kandidatlistan låg på mötenas runner.
      - name: Omkonverteringen, och det som kommit sedan mötenas jobb
        uses: ./.github/actions/levande
      - name: Arkivet för varje kommun
        # Ett fel i arkivet stoppar inte incheckningen av det levande (ADR-0018).
        continue-on-error: true
        run: |
          for kommunfil in kommuner/*.toml; do
            python -m kommunhandlingar.upptack "$kommunfil" "$RUNNER_TEMP/arbete" \
              --arkiv --start "$START" | tee -a "$RUNNER_TEMP/sammanfattning.txt"
            python -m kommunhandlingar.hamta "$kommunfil" "$RUNNER_TEMP/arbete" \
              --arkiv --start "$START" | tee -a "$RUNNER_TEMP/sammanfattning.txt"
          done
      - id: incheckning
        uses: ./.github/actions/checka-in
        with:
          del: arkiv
      - name: Sammanfattning
        if: always()
        run: |
          {
            echo '```'
            tail -n 200 "$RUNNER_TEMP/sammanfattning.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  pr-arkiv:
    needs: arkiv
    if: ${{ !cancelled() && needs.arkiv.outputs.gren != '' }}
    uses: ./.github/workflows/nattkorning-pr.yml
    with:
      gren: ${{ needs.arkiv.outputs.gren }}
    secrets:
      NATTKORNING_TOKEN: ${{ secrets.NATTKORNING_TOKEN }}
