# Tillfällig: prövar om Actions når web.archive.org (#24). Tas bort före merge.
name: Wayback-prov

on:
  push:
    branches: [claude/project-thread-xyxzz8]

permissions:
  contents: read

jobs:
  prov:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Äldsta generationen (~/link/)
        run: |
          curl -sS --retry 4 --retry-delay 10 --retry-all-errors -m 300 -G "https://web.archive.org/cdx/search/cdx" \
            --data-urlencode "url=kungsbacka.se" --data-urlencode "matchType=domain" \
            --data-urlencode "filter=urlkey:.*(~/link/|/global/).*" --data-urlencode "filter=mimetype:application/pdf" \
            --data-urlencode "filter=statuscode:200" --data-urlencode "collapse=urlkey" \
            --data-urlencode "fl=timestamp,original" > gamla.txt
          wc -l gamla.txt
          sed -E 's#^[0-9]+ https?://(www\.)?kungsbacka\.se(:80)?##I' gamla.txt | sed -E 's#/[^/]*$##' | sort | uniq -c | sort -rn | head -60
      - name: Mötessidorna över tid
        run: |
          cat > sidor.py <<'PY'
          import json, re, time, urllib.parse, urllib.request
          UA = {"User-Agent": "kommunhandlingar (+https://github.com/moggleif/kommunhandlingar)"}
          def hamta(url):
              for forsok in range(4):
                  try:
                      return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=120).read().decode("utf-8", "replace")
                  except Exception as fel:
                      print("FEL", url, fel); time.sleep(15 * (forsok + 1))
              return ""
          bas = "kungsbacka.se/kommun-och-politik/politik-och-demokrati/politiska-moten-och-sammantraden/"
          q = urllib.parse.urlencode({"url": bas, "matchType": "prefix", "filter": ["statuscode:200", "mimetype:text/html"], "fl": "timestamp,original", "collapse": "timestamp:4"}, doseq=True)
          lista = [r.split() for r in hamta("https://web.archive.org/cdx/search/cdx?" + q).splitlines()]
          lista = [(t, u) for t, u in lista if re.search(r"sammantraden/[a-z-]+-sammantraden/?$", u)]
          print("SNAPSHOTS", len(lista))
          for t, u in lista:
              time.sleep(5)
              html = hamta(f"https://web.archive.org/web/{t}id_/{u}")
              ar = sorted(set(re.findall(r"möten (\d{4})", html)))
              filer = sorted(set(re.findall(r"/download/(18\.[0-9a-f.]+)/\d+/([^\"'?#<>]+)", html)))
              print("SIDA", t, u.rstrip("/").split("/")[-1], ",".join(ar), len(filer))
              for nod, namn in filer:
                  print("FIL", t, u.rstrip("/").split("/")[-1], nod, urllib.parse.unquote(namn))
          PY
          python3 -u sidor.py
