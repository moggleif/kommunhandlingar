name: Kontroll

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kontroll:
    name: Ren kod och tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inga binärer utom små testfixturer (AGENTS.md)
        run: |
          if git ls-files --eol | grep 'i/-text' | grep -v $'\ttests/fixtures/'; then exit 1; fi
          if find tests/fixtures -type f -size +1M 2>/dev/null | grep .; then exit 1; fi
      - run: pip install -e ".[utveckling]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/kontrollera_storlek.py
      - run: python -m unittest discover -s tests -t .
      - name: Kända sårbarheter i projektets beroenden
        run: pip-audit .
