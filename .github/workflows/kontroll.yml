name: Kontroll

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kontroll:
    name: Ren kod och tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.10"
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/kontrollera_storlek.py
      - run: python -m unittest discover -s tests -t .
