name: Kontroll

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kontroll:
    name: Ren kod och tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Inga binärer utom små testfixturer (AGENTS.md)
        run: |
          if git ls-files --eol | grep 'i/-text' | grep -v $'\ttests/fixtures/'; then exit 1; fi
          if find tests/fixtures -type f -size +1M 2>/dev/null | grep .; then exit 1; fi
      - name: Tesseract med svensk modell (OCR, ADR-0005)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-swe
      - run: pip install -e ".[utveckling]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/kontrollera_storlek.py
      - run: python -m unittest discover -s tests -t .
      - name: Markdown-lint på ändrade filer (ADR-0021)
        if: github.event_name == 'pull_request'
        # HEAD är PR:ens merge-commit; dess första förälder är basen. En stor
        # fil tar en minut, så filerna delas på fyra processer. Ett `:` först
        # gör namnet till en sökväg och inte ett glob-mönster.
        run: |
          set -o pipefail
          npm install --global markdownlint-cli2@0.23.3
          git fetch --no-tags --deepen=1
          git diff -z --name-only --diff-filter=AMR HEAD^1 HEAD -- '*.md' \
            | sed -z 's/^/:/' | xargs -0 -r -P 4 -n 25 markdownlint-cli2
      - name: Datakontrollerna (K11)
        run: python -m kommunhandlingar.datakontroll data
      - name: Kända sårbarheter i projektets beroenden
        run: pip-audit .
