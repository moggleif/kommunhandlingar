# Datakontrollerna och incheckningen på en egen gren, som båda nattkörningens
# jobb gör (K11, K53, ADR-0015 och ADR-0077).
name: Checka in nattkörningen
description: Kontrollerar datat och pushar det på grenen nattkorning/<datum>-<id>-<del>.
inputs:
  del:
    description: moten eller arkiv
    required: true
outputs:
  gren:
    description: grenen som pushades, tom när inget ändrats
    value: ${{ steps.incheckning.outputs.gren }}
runs:
  using: composite
  steps:
    - name: Datakontrollerna
      shell: bash
      run: python -m kommunhandlingar.datakontroll data
    - name: Bara textfiler under data/ och versioner/
      shell: bash
      run: |
        git add -A
        if git -c core.quotePath=false diff --cached --name-only | grep -Ev '^(data|versioner)/'; then exit 1; fi
        if git diff --cached --numstat | grep '^-'; then exit 1; fi
    - name: Checka in på en egen gren
      id: incheckning
      shell: bash
      run: |
        if git diff --cached --quiet; then
          echo "Inget nytt i poolen." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        gren="nattkorning/$(date -u +%F)-${{ github.run_id }}-${{ inputs.del }}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -q -m "Nattkörning $(date -u +%F), ${{ inputs.del }}"
        git push origin "HEAD:refs/heads/$gren"
        echo "gren=$gren" >> "$GITHUB_OUTPUT"
